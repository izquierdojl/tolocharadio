services:
  tolocharadio:
    image: ghcr.io/izquierdojl/tolocharadio:latest
    container_name: tolocharadio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/tolocharadio.db
      STATIC_DIR: /app/apps/web/dist
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      REFRESH_ROTATE_THRESHOLD: ${REFRESH_ROTATE_THRESHOLD:-24h}
      REFRESH_GRACE_MS: ${REFRESH_GRACE_MS:-60000}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RADIOBROWSER_BASE_URL: ${RADIOBROWSER_BASE_URL:-https://all.api.radio-browser.info}
      RADIOBROWSER_APP_NAME: ${RADIOBROWSER_APP_NAME:-TolochaRadio}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-300000}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-100}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Europe/Madrid}
      STATS_FLUSH_INTERVAL_MS: ${STATS_FLUSH_INTERVAL_MS:-30000}
      STATS_PULSE_CAP_MS: ${STATS_PULSE_CAP_MS:-15000}
      STATS_HLS_IDLE_MS: ${STATS_HLS_IDLE_MS:-60000}
      PODCASTS_ENABLED: ${PODCASTS_ENABLED:-true}
      PODCAST_DISCOVERY_PROVIDER: ${PODCAST_DISCOVERY_PROVIDER:-itunes}
      PODCAST_STREAM_MODE: ${PODCAST_STREAM_MODE:-proxy}
      PODCAST_FEED_MAX_BYTES: ${PODCAST_FEED_MAX_BYTES:-5242880}
      PODCAST_REFRESH_INTERVAL_MS: ${PODCAST_REFRESH_INTERVAL_MS:-900000}
      PODCAST_PLAYBACK_TOKEN_TTL: ${PODCAST_PLAYBACK_TOKEN_TTL:-6h}
      PODCAST_STATS_RETENTION_DAYS: ${PODCAST_STATS_RETENTION_DAYS:-730}
      PODCASTINDEX_API_KEY: ${PODCASTINDEX_API_KEY:-}
      PODCASTINDEX_API_SECRET: ${PODCASTINDEX_API_SECRET:-}
    volumes:
      # Volumen nombrado: la base SQLite persiste entre reinicios.
      # (Alternativa bind para inspeccionar la DB: "./data:/data" y asegurar
      #  que el directorio lo posea el usuario con uid 1000, ej.
      #  `mkdir -p data && chown 1000:1000 data`.)
      - tolocharadio_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  tolocharadio_data: