version: 2

updates:
  # Dependencias npm (raíz + workspaces). Las actualizaciones minor/patch de
  # npm y de GitHub Actions activan el auto-merge (workflow dependabot-automerge)
  # y se fusionan cuando pasa CI; las versiones mayores se revisan a mano.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      produccion:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      desarrollo:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5

  # Crates del cliente de escritorio (Tauri). Sin auto-merge: el CI no compila
  # Rust en cada PR.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
