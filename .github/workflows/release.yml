name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Las releases solo se publican cuando el tag apunta a un commit de `main`
  # (es decir, después de fusionar la rama feature). Un tag en una rama sin
  # fusionar no publica nada.
  preflight:
    name: Comprobar que el tag está en main
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontró origin/main; no se publica release."
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "El tag $GITHUB_REF_NAME está en main: se publica la release."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::El tag $GITHUB_REF_NAME no apunta a un commit de main; no se publica release. Fusiona la rama a main y etiqueta de nuevo."
          fi

  release:
    needs: preflight
    if: needs.preflight.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolver última versión de Node 22.x
        id: node
        run: |
          NODE="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.version | startswith("v22."))][0].version' \
            | sed 's/^v//' || true)"
          echo "version=${NODE:-22}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=node${{ steps.node.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Cliente de escritorio (${{ matrix.platform }})
    needs: preflight
    if: needs.preflight.outputs.on_main == 'true'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Instalar dependencias npm
        # --ignore-scripts: el cliente no usa dependencias nativas (la API no se
        # compila aquí) y en Windows node-gyp no detecta Visual Studio del runner.
        run: npm ci --ignore-scripts

      - name: Build y publicación de instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "TolochaRadio ${{ github.ref_name }}"
          releaseBody: "Imagen Docker en GHCR y binarios del cliente de escritorio adjuntos. Consulta el repositorio para los cambios."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
