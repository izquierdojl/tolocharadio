name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  checks: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Las releases solo se publican cuando el tag apunta a un commit de `main`
  # y el CI de ese commit ya está en verde.
  preflight:
    name: Comprobar main y CI
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Comprobar que el tag está en main
        run: |
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontró origin/main; no se publica release."
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "El tag $GITHUB_REF_NAME está en main: se publica la release."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::El tag $GITHUB_REF_NAME no apunta a un commit de main; no se publica release. Fusiona la rama a main y etiqueta de nuevo."
          fi
      - name: Esperar a que el CI del commit esté en verde
        if: steps.check.outputs.on_main == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Esperando el check 'quality' para $SHA..."
          for i in $(seq 1 60); do
            if ! RESULT="$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "quality")] | sort_by(.started_at) | last | "\(.status // "") \(.conclusion // "")"' 2>/dev/null)"; then
              RESULT="error"
            fi
            echo "Intento $i: ${RESULT:-sin datos}"
            case "$RESULT" in
              "completed success")
                echo "CI verde: se puede publicar."
                exit 0
                ;;
              "completed failure"|"completed cancelled"|"completed timed_out"|"completed action_required"|"completed stale"|"completed skipped")
                echo "::error::El CI del commit $SHA no pasó ($RESULT). No se publica."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timeout esperando el CI de $SHA (10 minutos)."
          exit 1

  release:
    needs: preflight
    if: needs.preflight.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4
      - name: Resolver Node y la base Alpine
        id: node
        run: |
          NODE="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.version | startswith("v22."))][0].version' \
            | sed 's/^v//' || true)"
          if [[ -z "$NODE" || "$NODE" == "null" ]]; then
            echo "::error::No se pudo obtener la última versión de Node 22.x"
            exit 1
          fi
          BASE_DIGEST="$(docker buildx imagetools inspect \
            "docker.io/library/node:${NODE}-alpine" \
            --format '{{.Manifest.Digest}}' | tr -d '\r\n')"
          if [[ -z "$BASE_DIGEST" ]]; then
            echo "::error::No se pudo obtener el digest de node:${NODE}-alpine"
            exit 1
          fi
          {
            echo "version=$NODE"
            echo "base_digest=$BASE_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=node${{ steps.node.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build de la imagen definitiva
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tolocharadio:release
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=node:${{ steps.node.outputs.version }}-alpine
            org.opencontainers.image.base.digest=${{ steps.node.outputs.base_digest }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escanear la imagen antes de publicarla
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tolocharadio:release
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test en contenedor
        run: |
          trap 'docker rm -f tolocharadio-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name tolocharadio-smoke \
            -e JWT_ACCESS_SECRET="smoke-access-secret-0123456789abcd" \
            -e JWT_REFRESH_SECRET="smoke-refresh-secret-9876543210wxyz" \
            -p 127.0.0.1:3100:3000 tolocharadio:release
          sleep 3
          docker ps -a
          echo "--- logs del arranque ---"
          docker logs tolocharadio-smoke
          echo "--- probando health ---"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/v1/health
          curl -fsS http://127.0.0.1:3100/ | grep -q TolochaRadio
      - name: Publicar tags en GHCR
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag tolocharadio:release "$tag"
            docker push "$tag"
          done
