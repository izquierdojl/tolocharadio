name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Los PR cancelan ejecuciones antiguas del mismo PR. En main no se cancela
# nada: el gate de release consulta el CI del commit exacto.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Solo se necesita en PRs: decide si el cambio toca la imagen Docker.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - "Dockerfile"
              - "docker-entrypoint.sh"
              - ".dockerignore"
              - "package-lock.json"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias npm (producción)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - run: npm run build

  # La imagen solo se valida en PRs que tocan el Dockerfile o el lockfile.
  # El release construye, escanea y prueba la imagen definitiva antes de
  # publicarla; no se publican imágenes desde integración.
  docker:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tolocharadio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test en contenedor
        run: |
          trap 'docker rm -f tolocharadio-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name tolocharadio-smoke \
            -e JWT_ACCESS_SECRET="smoke-access-secret-0123456789abcd" \
            -e JWT_REFRESH_SECRET="smoke-refresh-secret-9876543210wxyz" \
            -p 127.0.0.1:3100:3000 tolocharadio:test
          sleep 3
          docker ps -a
          echo "--- logs del arranque ---"
          docker logs tolocharadio-smoke
          echo "--- probando health ---"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/v1/health
          curl -fsS http://127.0.0.1:3100/ | grep -q TolochaRadio
      - name: Escanear vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tolocharadio:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
